<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Oyunlarım</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #1e293b;
    }

    h1 {
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #38bdf8;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<header>
  <h1>🎮 Python Oyunlarım</h1>
  <p>Kendi geliştirdiğim oyunlar ve indirilebilir uygulamalar</p>
</header>

<div class="container">
  <div class="grid">

    <!-- Taş Kağıt Makas -->
    <div class="card">
      <h3>Taş Kağıt Makas</h3>
      <p>Basit ama eğlenceli klasik oyun.</p>
      <a href="tas-kagit-makas.html" class="btn">Oyuna Git</a>
      <a href="#" class="btn">EXE İndir</a>
    </div>

    <!-- Tavla -->
    <div class="card">
      <h3>Tavla</h3>
      <p>Python ile geliştirilmiş tavla oyunu.</p>
      <a href="tavla.html" class="btn">Oyuna Git</a>
      <a href="#" class="btn">EXE İndir</a>
    </div>

    <!-- Yeni Oyun Eklemek İçin Kopyala -->
    <div class="card">
      <h3>Yeni Oyun</h3>
      <p>Buraya kendi oyununu ekleyebilirsin.</p>
      <a href="#" class="btn">Oyuna Git</a>
      <a href="#" class="btn">EXE İndir</a>
    </div>

  </div>
</div>

</body>
</html>
