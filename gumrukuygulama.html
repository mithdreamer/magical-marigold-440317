<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gümrük Uygulamaları</title>

<style>
body{
    font-family: Arial;
    margin:40px;
    background:#f4f6f8;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:900px;
    margin:auto;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    color:#1f4e79;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th, table td{
    border:1px solid #ccc;
    padding:12px;
    text-align:left;
}

table th{
    background:#1f4e79;
    color:white;
}

.input-group{
    margin-top:15px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    margin-top:20px;
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
}

.result{
    margin-top:20px;
    background:#eef5ff;
    padding:15px;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">

<h1>Gümrük Uygulamaları Portalı</h1>

<p>
Ardiye ve KKDF maliyet karşılaştırma ekranı
</p>

<table>
<tr>
    <th>Kalem</th>
    <th>Ardiye</th>
    <th>KKDF</th>
</tr>

<tr>
    <td>Hesaplama Türü</td>
    <td>Günlük Depolama</td>
    <td>Yüzdesel Kesinti</td>
</tr>

<tr>
    <td>Etkileyen Faktör</td>
    <td>Bekleme Süresi</td>
    <td>Finansman Şekli</td>
</tr>

<tr>
    <td>Uygulama Alanı</td>
    <td>Liman / Antrepo</td>
    <td>İthalat İşlemleri</td>
</tr>
</table>

<h2>Hesaplama</h2>

<div class="input-group">
<label>Mal Bedeli (TL)</label>
<input type="number" id="bedel">
</div>

<div class="input-group">
<label>Ardiye Gün Sayısı</label>
<input type="number" id="gun">
</div>

<div class="input-group">
<label>KKDF Oranı (%)</label>
<input type="number" id="kkdf">
</div>

<button onclick="hesapla()">Hesapla</button>

<div class="result" id="sonuc"></div>

</div>

<script>
function hesapla(){

    let bedel = parseFloat(document.getElementById("bedel").value);
    let gun = parseFloat(document.getElementById("gun").value);
    let kkdf = parseFloat(document.getElementById("kkdf").value);

    let ardiye = gun * 150;

    let kkdfTutari = bedel * kkdf / 100;

    document.getElementById("sonuc").innerHTML =
    `
    <b>Ardiye Tutarı:</b> ${ardiye.toFixed(2)} TL<br>
    <b>KKDF Tutarı:</b> ${kkdfTutari.toFixed(2)} TL
    `;
}
</script>

</body>
</html>
